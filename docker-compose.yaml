services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Opcional: para evitar timeout em respostas longas
      - OLLAMA_LOAD_TIMEOUT=5m
    # Comando para baixar o modelo automaticamente (se não existir) e iniciar o servidor
    command: >
      sh -c "ollama pull qwen2.5-coder:1.5b && ollama serve"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://ollama:11434/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  ollama_data:
    name: ollama_data