apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Receiver para coletar as métricas internas do próprio Collector
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector-internal'
              scrape_interval: 10s
              static_configs:
                - targets: ['0.0.0.0:8888']

    processors:
      batch:
        send_batch_size: 1000
        timeout: 1s
      memory_limiter:
        check_interval: 1s
        limit_mib: 512

    exporters:
      debug:
        verbosity: detailed
      zipkin:
        endpoint: "http://zipkin:9411/api/v2/spans"
        format: "json"
      prometheus:
        endpoint: "0.0.0.0:8889"
        send_timestamps: true
        metric_expiration: 180m
        resource_to_telemetry_conversion:
          enabled: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, zipkin]
        
        metrics:
          receivers: [otlp]
          processors: [batch, memory_limiter]
          exporters: [debug, prometheus]
        
        metrics/internal:
          receivers: [prometheus]
          processors: [batch]
          exporters: [prometheus]
        
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]