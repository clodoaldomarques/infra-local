apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-deployment
  labels:
    com.job.service: otel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.120.0
        args:
        - "--config=/conf/config.yaml"
        ports:
        - containerPort: 4317
        - containerPort: 4318
        - containerPort: 8888   # métricas do próprio collector (para o Prometheus scrappar)
        - containerPort: 13133  # health check
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        volumeMounts:
        - name: config
          mountPath: /conf
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: otel-collector-config