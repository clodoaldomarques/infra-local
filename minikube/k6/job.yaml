apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
spec:
  template:
    metadata:
      labels:
        app: k6-job
    spec:
      containers:
      - name: k6
        image: grafana/k6:latest
        command: ["k6", "run", "/scripts/script.js"]
        volumeMounts:
        - name: k6-scripts
          mountPath: /scripts
        env:
        # ---- Configuração de output: OTLP para o OTel Collector ----
        - name: K6_OUT
          value: "opentelemetry"
        - name: K6_OTEL_GRPC_EXPORTER_ENDPOINT
          value: "otel:4317"
        - name: K6_OTEL_GRPC_EXPORTER_INSECURE
          value: "true"
        - name: K6_OTEL_METRIC_PREFIX
          value: "k6_"
        # -----------------------------------------------------------
        envFrom:
        - configMapRef:
            name: k6-env
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: k6-scripts
        configMap:
          name: k6-script
      restartPolicy: Never
  backoffLimit: 1