apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  labels:
    com.job.service: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      com.job.service: localstack
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        com.job.service: localstack
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      containers:
      - name: localstack
        image: localstack/localstack:3.7.0
        imagePullPolicy: IfNotPresent
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        - name: SERVICES
          value: sqs,sns,dynamodb,s3
        - name: DATA_DIR
          value: /var/lib/localstack
        - name: LS_LOG
          value: warn
        - name: DEBUG
          value: "0"
        - name: EXTENSION_AUTO_INSTALL
          value: "localstack-extension-platform-observability"
        ports:
        - name: edge
          containerPort: 4566
          protocol: TCP
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1024Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /_localstack/health
            port: 4566
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /_localstack/health
            port: 4566
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: localstack-storage
          mountPath: /var/lib/localstack
        - name: init-scripts
          mountPath: /etc/localstack/init/ready.d
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      - name: localstack-storage
        persistentVolumeClaim:
          claimName: localstack-claim
      - name: init-scripts
        configMap:
          name: localstack-init-scripts
          defaultMode: 0755